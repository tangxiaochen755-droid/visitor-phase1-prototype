<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>门卫扫码设备端</title><link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"><style>
:root{--ink:#202327;--muted:#737981;--line:#d9dde0;--soft:#eef0f2;--paper:#fff;--dark:#25292d;--ok:#356449;--okbg:#eaf3ed;--bad:#963d3d;--badbg:#f7eaea;--warn:#886319;--warnbg:#faf3e4}*{box-sizing:border-box}body{margin:0;background:#171a1d;color:var(--ink);font:14px "PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}.device{width:100vw;height:100vh;min-width:1024px;min-height:600px;background:var(--soft);display:grid;grid-template-rows:64px 1fr}.top{background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 24px}.brand{font-size:18px;font-weight:600}.device-info{margin-left:24px;color:#adb2b7;font-size:12px}.online{margin-left:auto;color:#cbd8cf}.online i{color:#7fb08e}.account{border:0;background:#393e43;color:#fff;border-radius:5px;padding:9px 13px;margin-left:20px}.shell{display:grid;grid-template-columns:190px 1fr;min-height:0}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.side button{width:100%;height:54px;border:0;border-radius:7px;background:#fff;text-align:left;padding:0 16px;color:#62686e;font-size:15px;margin-bottom:8px}.side button i{font-size:20px;margin-right:10px;vertical-align:-2px}.side button.active{background:#30353a;color:#fff;font-weight:600}.main{min-width:0;overflow:auto;padding:18px}.view{display:none;height:100%}.view.active{display:block}.head{height:48px;display:flex;align-items:flex-start}.head h1{font-size:21px;margin:0}.head span{color:var(--muted);font-size:12px;margin:7px 0 0 12px}.scan-layout{height:calc(100% - 48px);display:grid;grid-template-columns:minmax(460px,1.15fr) minmax(390px,.85fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:0}.camera-panel{display:flex;flex-direction:column;padding:16px}.camera{flex:1;min-height:300px;background:#22272b;border-radius:8px;position:relative;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}.frame{width:min(45%,270px);aspect-ratio:1;border:2px solid #e9ecee;position:relative}.frame:before,.frame:after{content:"";position:absolute;width:35px;height:35px;border-color:#fff;border-style:solid}.frame:before{left:-3px;top:-3px;border-width:5px 0 0 5px}.frame:after{right:-3px;bottom:-3px;border-width:0 5px 5px 0}.scanline{position:absolute;left:8%;right:8%;height:2px;background:#fff;box-shadow:0 0 12px #fff;animation:scan 2s linear infinite}@keyframes scan{0%{top:8%}100%{top:90%}}.camera p{position:absolute;bottom:22px;color:#bfc4c8}.manual{display:flex;gap:10px;margin-top:12px}.input,.select{height:44px;border:1px solid #cbd0d4;border-radius:6px;background:#fff;padding:0 12px}.manual .input{flex:1}.btn{height:44px;border:1px solid #c9ced2;background:#fff;border-radius:6px;padding:0 18px;font-weight:500}.btn.primary{background:#30353a;color:#fff;border-color:#30353a}.result-panel{padding:18px;display:flex;flex-direction:column}.placeholder{margin:auto;text-align:center;color:#888}.placeholder i{display:block;font-size:58px;color:#c4c8cb;margin-bottom:10px}.result{display:none;height:100%}.result.show{display:flex;flex-direction:column}.result-status{text-align:center;border-radius:8px;padding:20px;margin-bottom:16px}.result-status.ok{background:var(--okbg);color:var(--ok)}.result-status.bad{background:var(--badbg);color:var(--bad)}.result-status i{font-size:42px;display:block}.result-status b{font-size:21px}.detail{display:grid;grid-template-columns:100px 1fr;gap:13px 9px;padding:8px 6px}.detail label{color:var(--muted)}.result .btn{margin-top:auto;width:100%}.toolbar{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:10px;margin-bottom:12px}.toolbar .input{width:220px}.toolbar .select{width:150px}.table-panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:920px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{background:#f7f8f8;color:#666;font-size:12px}.tag{font-size:11px;border-radius:10px;padding:3px 8px;background:#eee;color:#666}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.messages{display:grid;grid-template-columns:360px 1fr;gap:14px;height:calc(100% - 48px)}.message-list{padding:8px;overflow:auto}.message{padding:15px;border-bottom:1px solid #eceff1;cursor:pointer}.message.active{background:#f0f2f3;border-radius:6px}.message b{display:block;margin-bottom:5px}.message p{margin:0;color:#777;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message time{display:block;font-size:11px;color:#aaa;margin-top:7px}.message-detail{padding:26px}.message-detail h2{font-size:20px}.message-detail p{line-height:2;color:#555;max-width:760px}.mask{position:fixed;inset:0;background:rgba(10,12,14,.55);display:none;place-items:center;z-index:20}.mask.open{display:grid}.dialog{width:480px;background:#fff;border-radius:9px;padding:22px}.dialog-head{display:flex;font-size:17px;font-weight:600;margin-bottom:18px}.close{margin-left:auto;border:0;background:none;font-size:22px}.dialog .input{width:100%;margin-bottom:12px}.dialog-actions{display:flex;gap:10px;margin-top:16px}.dialog-actions .btn{flex:1}.toast{position:fixed;left:55%;top:45%;transform:translate(-50%,-50%);background:#25292d;color:#fff;padding:12px 20px;border-radius:6px;display:none;z-index:30}.toast.show{display:block}@media(max-height:680px){.top{height:56px}.device{grid-template-rows:56px 1fr}.side button{height:48px}.main{padding:12px}.head{height:42px}.scan-layout,.messages{height:calc(100% - 42px)}}
</style></head><body><div class="device"><header class="top"><div class="brand"><i class="ri-scan-2-line"></i> 华辰访客核验</div><div class="device-info">总部园区 · 北门 · BG-N-01</div><div class="online"><i class="ri-checkbox-blank-circle-fill"></i> 设备在线</div><button class="account" onclick="accountMask.classList.add('open')"><i class="ri-shield-user-line"></i> 门卫张</button></header><div class="shell"><aside class="side"><button class="active" onclick="switchView(this,'scan')"><i class="ri-qr-scan-2-line"></i>扫码确认</button><button onclick="switchView(this,'records')"><i class="ri-file-list-3-line"></i>进出记录</button><button onclick="switchView(this,'messages')"><i class="ri-notification-3-line"></i>我的消息通知</button></aside><main class="main">
<section class="view active" id="scan"><div class="head"><h1>扫码确认</h1><span>自动识别来访码和出访码</span></div><div class="scan-layout"><div class="panel camera-panel"><div class="camera"><div class="frame"><div class="scanline"></div></div><p>将访客二维码置于框内，系统将自动识别</p></div><div class="manual"><input class="input" id="manualCode" placeholder="摄像头不可用时，可手工输入二维码内容"><button class="btn" onclick="runScan('manual')">确认输入</button><button class="btn primary" onclick="runScan('visit')">模拟扫码</button></div></div><div class="panel result-panel"><div class="placeholder" id="placeholder"><i class="ri-qr-scan-2-line"></i><b>等待扫码</b><p>扫码结果将在此处显示</p></div><div class="result" id="result"><div class="result-status ok" id="resultStatus"><i class="ri-checkbox-circle-line"></i><b id="resultTitle">来访确认成功</b></div><div class="detail"><label>访客</label><b>张晨 · VIS-000001</b><label>被访人</label><span>李敏 · 产品研发部</span><label>同行/车辆</label><span>2 人 / 1 辆</span><label>通行点</label><span>总部园区 · 北门</span><label>核验时间</label><span id="scanTime">2026-08-04 09:26</span></div><button class="btn primary" onclick="continueScan()">继续扫码</button></div></div></div></section>
<section class="view" id="records"><div class="head"><h1>进出记录</h1><span>仅展示当前账号授权通行点</span></div><div class="toolbar"><input class="input" id="recordSearch" placeholder="访客姓名或手机号" oninput="renderTable()"><select class="select" id="recordType" onchange="renderTable()"><option>全部类型</option><option>来访</option><option>出访</option></select><input class="input" type="date" value="2026-08-04"><button class="btn" onclick="recordSearch.value='';recordType.value='全部类型';renderTable()">重置</button></div><div class="table-panel"><table><thead><tr><th>访客</th><th>手机号</th><th>被访人</th><th>类型</th><th>进出时间</th><th>通行点</th><th>同行</th><th>车辆</th><th>结果</th><th>操作</th></tr></thead><tbody id="recordBody"></tbody></table></div></section>
<section class="view" id="messages"><div class="head"><h1>我的消息通知</h1><span>后台发送给当前门卫或所属场所的通知</span></div><div class="messages"><div class="panel message-list" id="messageList"></div><div class="panel message-detail" id="messageDetail"></div></div></section></main></div></div>
<div class="mask" id="accountMask" onclick="if(event.target===this)this.classList.remove('open')"><div class="dialog"><div class="dialog-head">账户与设备<button class="close" onclick="accountMask.classList.remove('open')">×</button></div><div class="detail"><label>门卫姓名</label><b>门卫张</b><label>身份编码</label><span>GRD-000001</span><label>绑定通行点</label><span>总部园区 · 北门</span><label>设备状态</label><span>BG-N-01 · 在线</span></div><div class="dialog-actions"><button class="btn" onclick="openPhone()">换绑手机号</button><button class="btn" onclick="toast('已退出演示账号')">退出登录</button></div></div></div><div class="mask" id="phoneMask"><div class="dialog"><div class="dialog-head">换绑手机号<button class="close" onclick="phoneMask.classList.remove('open')">×</button></div><label>原手机号</label><input class="input" value="13900001001" disabled><label>验证码</label><input class="input" id="phoneCode" placeholder="原型验证码 123456"><label>新手机号</label><input class="input" id="newPhone" placeholder="请输入新手机号"><div class="dialog-actions"><button class="btn" onclick="phoneMask.classList.remove('open')">取消</button><button class="btn primary" onclick="toast('手机号修改成功，身份编码保持不变');phoneMask.classList.remove('open')">确认修改</button></div></div></div><div class="toast" id="toast"></div>
<script>
const rows=[{name:'张晨',phone:'138****6201',visitee:'李敏',type:'来访',time:'09:26',point:'北门',people:2,cars:1,result:'成功'},{name:'王伟',phone:'139****3408',visitee:'赵雪',type:'出访',time:'09:18',point:'北门',people:1,cars:0,result:'成功'},{name:'周悦',phone:'137****1166',visitee:'王磊',type:'来访',time:'09:06',point:'北门',people:1,cars:0,result:'成功'},{name:'许舟',phone:'136****2308',visitee:'李敏',type:'来访',time:'08:55',point:'北门',people:1,cars:1,result:'失败'}];const messages=[{title:'北门设备维护提醒',content:'北门备用扫码设备将于今日 18:00 进行维护，请提前做好现场引导。',time:'08-04 15:30',from:'场所管理员 王强'},{title:'消防演练期间访客通行安排',content:'明日上午总部园区进行消防演练，来访人员统一由北门完成核验后按照现场指引通行。',time:'08-04 10:10',from:'企业管理员 陈晓'},{title:'二维码异常处理规范',content:'遇到二维码已失效或通行点不符时，不得人工放行，请联系被访人或企业管理员处理。',time:'08-02 16:45',from:'行政管理部'}];
function switchView(btn,id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.side button').forEach(v=>v.classList.toggle('active',v===btn));if(id==='records')renderTable();if(id==='messages')renderMessages()}function runScan(source){const code=manualCode.value.trim();placeholder.style.display='none';result.classList.add('show');scanTime.textContent=new Date().toLocaleString('zh-CN',{hour12:false});if(source==='manual'&&!code){resultStatus.className='result-status bad';resultStatus.innerHTML='<i class="ri-close-circle-line"></i><b>请输入二维码内容</b>';return}if(code.toLowerCase().includes('bad')){resultStatus.className='result-status bad';resultStatus.innerHTML='<i class="ri-close-circle-line"></i><b>二维码已失效</b>';return}resultStatus.className='result-status ok';resultStatus.innerHTML='<i class="ri-checkbox-circle-line"></i><b>来访确认成功</b>';rows.unshift({name:'张晨',phone:'138****6201',visitee:'李敏',type:'来访',time:new Date().toTimeString().slice(0,5),point:'北门',people:2,cars:1,result:'成功'})}function continueScan(){result.classList.remove('show');placeholder.style.display='block';manualCode.value=''}function renderTable(){const q=(recordSearch.value||'').trim(),type=recordType.value;const list=rows.filter(r=>(!q||(r.name+r.phone).includes(q))&&(type==='全部类型'||r.type===type));recordBody.innerHTML=list.map(r=>`<tr><td>${r.name}</td><td>${r.phone}</td><td>${r.visitee}</td><td>${r.type}</td><td>08-04 ${r.time}</td><td>总部园区 · ${r.point}</td><td>${r.people} 人</td><td>${r.cars} 辆</td><td><span class="tag ${r.result==='成功'?'ok':'bad'}">${r.result}</span></td><td><button class="btn" style="height:32px" onclick="toast('已打开记录详情')">详情</button></td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;color:#888">暂无符合条件的记录</td></tr>'}function renderMessages(){messageList.innerHTML=messages.map((m,i)=>`<article class="message ${i===0?'active':''}" onclick="selectMessage(${i},this)"><b>${m.title}</b><p>${m.content}</p><time>${m.time}</time></article>`).join('');showMessage(0)}function selectMessage(i,el){document.querySelectorAll('.message').forEach(x=>x.classList.toggle('active',x===el));showMessage(i)}function showMessage(i){const m=messages[i];messageDetail.innerHTML=`<h2>${m.title}</h2><p>${m.content}</p><div style="color:#999;margin-top:28px">${m.time}<br>发布人：${m.from}</div>`}function openPhone(){accountMask.classList.remove('open');phoneMask.classList.add('open')}let timer;function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1800)}renderTable();renderMessages();
</script></body></html>
