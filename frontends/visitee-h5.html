<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>被访人端 · 华辰科技</title><link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"><style>
:root{--ink:#202327;--muted:#737981;--line:#dfe2e5;--soft:#f4f5f6;--paper:#fff;--dark:#292d31;--warn:#8a6419;--warnbg:#faf4e7;--bad:#9a3f3f;--badbg:#faeeee;--ok:#3d6b55;--okbg:#edf5f0}*{box-sizing:border-box}body{margin:0;background:#e9ebed;color:var(--ink);font:14px "PingFang SC","Microsoft YaHei",sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--soft);position:relative;padding-bottom:76px}.top{height:138px;background:var(--dark);color:#fff;padding:22px 20px}.topbar{display:flex;align-items:center}.brand{font-size:16px;font-weight:600}.account{margin-left:auto;border:0;background:#3b4045;color:#fff;border-radius:18px;padding:7px 12px}.greet{margin-top:24px}.greet b{font-size:22px;display:block}.greet span{display:block;color:#c8ccd0;margin-top:5px;font-size:12px}.view{display:none;padding:16px}.view.active{display:block}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-32px;margin-bottom:16px}.summary div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 8px;text-align:center}.summary b{font:600 23px ui-monospace,SFMono-Regular,Menlo,monospace;display:block}.summary span{font-size:11px;color:var(--muted)}.section-title{font-size:18px;font-weight:600;margin-bottom:4px}.section-sub{font-size:12px;color:var(--muted);margin-bottom:14px}.search{height:42px;background:#fff;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;padding:0 12px;margin-bottom:10px}.search i{color:#777}.search input{border:0;outline:0;flex:1;padding-left:8px}.filter{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.chip{white-space:nowrap;border:1px solid #d3d6d9;background:#fff;border-radius:16px;padding:6px 11px;color:#686e75}.chip.active{background:#303439;color:#fff;border-color:#303439}.record,.message{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px}.record-head{display:flex;align-items:center}.record-head b{font-size:15px}.status{margin-left:auto;border-radius:11px;padding:3px 8px;font-size:11px;background:#eee;color:#656b72}.status.warn{background:var(--warnbg);color:var(--warn)}.status.ok{background:var(--okbg);color:var(--ok)}.status.bad{background:var(--badbg);color:var(--bad)}.meta{color:var(--muted);font-size:12px;line-height:1.8;margin-top:8px}.actions{display:flex;gap:8px;margin-top:10px}.btn{height:38px;border:1px solid #cdd1d5;background:#fff;border-radius:6px;padding:0 15px}.btn.primary{background:#303439;color:#fff;border-color:#303439}.btn.danger{color:#8d3c3c;border-color:#d9bcbc}.message h3{font-size:15px;margin:0 0 7px}.message p{font-size:12px;color:#666;line-height:1.7;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.message time{font-size:11px;color:#999}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr);z-index:5}.nav button{border:0;background:#fff;color:#8a8f95}.nav i{display:block;font-size:21px}.nav button.active{color:#202327;font-weight:600}.mask{position:fixed;inset:0;background:rgba(20,22,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.mask.open{display:flex}.sheet{width:min(100%,430px);max-height:84vh;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:19px}.sheet-head{display:flex;align-items:center;margin-bottom:16px;font-size:16px;font-weight:600}.close{margin-left:auto;border:0;background:none;font-size:22px}.detail{display:grid;grid-template-columns:88px 1fr;gap:11px 8px;font-size:13px}.detail label{color:var(--muted)}.field{margin-top:14px}.field label{display:block;font-size:13px;margin-bottom:6px}.textarea,.input{width:100%;border:1px solid #ccd0d4;border-radius:6px;padding:10px 12px}.textarea{height:78px;resize:none}.sheet-actions{display:flex;gap:8px;margin-top:18px}.sheet-actions .btn{flex:1}.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:#262a2e;color:#fff;padding:11px 18px;border-radius:6px;z-index:30;display:none}.toast.show{display:block}@media(min-width:700px){body{padding:24px}.app{min-height:calc(100vh - 48px);box-shadow:0 15px 50px rgba(0,0,0,.14);border-radius:18px;overflow:hidden}.nav{bottom:24px}}
</style></head><body><div class="app"><header class="top"><div class="topbar"><div class="brand">华辰员工服务</div><button class="account" onclick="accountMask.classList.add('open')"><i class="ri-user-3-line"></i> 李敏</button></div><div class="greet"><b>待处理 2 条</b><span>产品研发部 · EMP-000001</span></div></header><main>
<section class="view active" id="applications"><div class="summary"><div><b id="pendingCount">2</b><span>待审核</span></div><div><b>3</b><span>今日来访</span></div><div><b>1</b><span>当前在访</span></div></div><div class="section-title">来访申请记录</div><div class="section-sub">查看并处理与您相关的全部来访申请</div><div class="search"><i class="ri-search-line"></i><input id="searchInput" placeholder="搜索访客姓名或手机号" oninput="renderRecords()"></div><div class="filter"><button class="chip active" data-status="全部" onclick="selectFilter(this)">全部</button><button class="chip" data-status="待审核" onclick="selectFilter(this)">待审核</button><button class="chip" data-status="待来访" onclick="selectFilter(this)">待来访</button><button class="chip" data-status="来访中" onclick="selectFilter(this)">来访中</button><button class="chip" data-status="已结束" onclick="selectFilter(this)">已结束</button></div><div id="recordList"></div></section>
<section class="view" id="messages"><div class="section-title">我的消息通知</div><div class="section-sub">来自企业后台的业务和管理通知</div><div id="messageList"></div></section></main><nav class="nav"><button class="active" onclick="switchView(this,'applications')"><i class="ri-file-list-3-line"></i>来访申请记录</button><button onclick="switchView(this,'messages')"><i class="ri-notification-3-line"></i>我的消息通知</button></nav></div>
<div class="mask" id="detailMask" onclick="if(event.target===this)closeAll()"><div class="sheet"><div class="sheet-head" id="detailTitle">申请详情<button class="close" onclick="closeAll()">×</button></div><div id="detailBody"></div></div></div><div class="mask" id="accountMask" onclick="if(event.target===this)this.classList.remove('open')"><div class="sheet"><div class="sheet-head">账户设置<button class="close" onclick="accountMask.classList.remove('open')">×</button></div><div class="detail"><label>员工姓名</label><b>李敏</b><label>身份编码</label><span>EMP-000001</span><label>所属部门</label><span>产品研发部</span><label>手机号</label><span>138****2071</span></div><div class="sheet-actions"><button class="btn" onclick="toast('进入修改密码')">修改密码</button><button class="btn" onclick="openPhone()">换绑手机号</button></div><button class="btn" style="width:100%;margin-top:8px" onclick="toast('已退出演示账号')">退出登录</button></div></div><div class="toast" id="toast"></div>
<script>
let selected='全部',current=null;const records=[{id:'VS202608040031',name:'陈浩',phone:'138****7812',company:'顺达供应链有限公司',date:'08-05 上午',purpose:'货物配送',people:2,car:'沪D372K8',status:'待审核'},{id:'VS202608040030',name:'周悦',phone:'139****1166',company:'星云数字科技',date:'08-05 下午',purpose:'项目交流',people:1,car:'无',status:'待审核'},{id:'VS202608030026',name:'张晨',phone:'138****6201',company:'上海远航科技',date:'08-04 上午',purpose:'商务洽谈',people:1,car:'沪A6F21Q',status:'待来访'},{id:'VS202608020018',name:'林清',phone:'177****1068',company:'长期服务商',date:'08-03 至 08-31',purpose:'驻场服务',people:1,car:'无',status:'来访中'},{id:'VS202607300011',name:'许舟',phone:'136****2308',company:'苏州云启技术',date:'07-30 下午',purpose:'技术交流',people:1,car:'无',status:'已结束'}];const messages=[{title:'总部园区访客接待提醒',content:'明日上午总部园区将进行消防演练，请提前告知来访人员按照现场引导通行。',time:'08-04 16:20',from:'企业管理员 陈晓'},{title:'访客申请处理规范更新',content:'审核拒绝申请时请填写明确原因，便于访客修改信息后重新提交。',time:'08-03 09:30',from:'行政管理部'},{title:'研发园区临时通行通知',content:'研发园区东门设备维护期间，请引导访客由北侧临时通行点进出。',time:'08-01 18:10',from:'场所管理员 王强'}];
function switchView(btn,id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(v=>v.classList.toggle('active',v===btn));scrollTo(0,0)}function selectFilter(btn){selected=btn.dataset.status;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===btn));renderRecords()}function cls(s){return s==='待审核'?'warn':s==='来访中'?'ok':s==='审核失败'||s==='已失效'?'bad':''}function renderRecords(){const q=(searchInput.value||'').trim();const rows=records.filter(r=>(selected==='全部'||r.status===selected)&&(!q||(r.name+r.phone).includes(q)));recordList.innerHTML=rows.length?rows.map(r=>`<article class="record"><div class="record-head"><b>${r.name} · ${r.date}</b><span class="status ${cls(r.status)}">${r.status}</span></div><div class="meta">${r.company} · ${r.phone}<br>${r.purpose} · 同行 ${r.people} 人 · ${r.car}</div><div class="actions"><button class="btn" onclick="openDetail('${r.id}')">查看详情</button>${r.status==='待审核'?`<button class="btn primary" onclick="openReview('${r.id}')">处理申请</button>`:''}</div></article>`).join(''):'<div class="record" style="text-align:center;color:#777">暂无符合条件的申请</div>';pendingCount.textContent=records.filter(x=>x.status==='待审核').length}function detailHtml(r){return `<div class="detail"><label>申请编号</label><b>${r.id}</b><label>访客姓名</label><span>${r.name}</span><label>访客单位</label><span>${r.company}</span><label>手机号</label><span>${r.phone}</span><label>拜访时间</label><span>${r.date}</span><label>来访目的</label><span>${r.purpose}</span><label>同行人数</label><span>${r.people} 人</span><label>车辆</label><span>${r.car}</span><label>当前状态</label><span class="status ${cls(r.status)}" style="margin:0;width:max-content">${r.status}</span></div>`}function openDetail(id){current=records.find(x=>x.id===id);detailTitle.childNodes[0].nodeValue='申请详情';detailBody.innerHTML=detailHtml(current);detailMask.classList.add('open')}function openReview(id){current=records.find(x=>x.id===id);detailTitle.childNodes[0].nodeValue='审核来访申请';detailBody.innerHTML=detailHtml(current)+`<div class="field"><label>拒绝原因（拒绝时必填）</label><textarea class="textarea" id="reason" placeholder="请输入明确的拒绝原因"></textarea></div><div class="sheet-actions"><button class="btn danger" onclick="reject()">拒绝</button><button class="btn primary" onclick="approve()">通过</button></div>`;detailMask.classList.add('open')}function approve(){current.status='待来访';closeAll();renderRecords();toast('审核通过，已生成来访码')}function reject(){if(!reason.value.trim())return toast('请填写拒绝原因');current.status='审核失败';closeAll();renderRecords();toast('已拒绝申请')}function closeAll(){detailMask.classList.remove('open')}function renderMessages(){messageList.innerHTML=messages.map((m,i)=>`<article class="message" onclick="openMessage(${i})"><h3>${m.title}</h3><p>${m.content}</p><time>${m.time} · ${m.from}</time></article>`).join('')}function openMessage(i){const m=messages[i];detailTitle.childNodes[0].nodeValue='通知详情';detailBody.innerHTML=`<h2 style="font-size:18px">${m.title}</h2><p style="line-height:1.9;color:#555">${m.content}</p><div class="meta">${m.time}<br>发布人：${m.from}</div>`;detailMask.classList.add('open')}function openPhone(){accountMask.classList.remove('open');detailTitle.childNodes[0].nodeValue='换绑手机号';detailBody.innerHTML=`<div class="field"><label>原手机号</label><input class="input" value="13800002071" disabled></div><div class="field"><label>验证码</label><input class="input" id="code" placeholder="原型验证码 123456"></div><div class="field"><label>新手机号</label><input class="input" id="phone" placeholder="请输入新手机号"></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="toast('手机号修改成功，身份编码保持不变');closeAll()">确认修改</button>`;detailMask.classList.add('open')}let timer;function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1800)}renderRecords();renderMessages();
</script></body></html>
